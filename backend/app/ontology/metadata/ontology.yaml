# TSG PM ontology manifest.
# Bump `version` (semver) whenever any metadata document changes; the service
# refuses to start when the same version is registered with different content.
kind: Ontology
version: v1
definition:
  apiName: tsg-pm
  displayName: TSG PM 项目运营本体
  version: 7.7.0
  description: 把 CRM、工时与人工维护数据统一为项目运营语义模型：对象、关系、动作、函数与安全策略。
---
kind: Marking
version: v1
definition:
  apiName: FINANCE
  displayName: 财务金额
  description: 合同额、开票、回款与计划回款金额，仅项目管理、CRM 查询与部门经营人员可见。
  permissions: [projects, crm, department]
---
kind: Marking
version: v1
definition:
  apiName: PERSONNEL
  displayName: 人员工时
  description: 员工个人工时与利用率，仅工时数据、资源运营与部门经营人员可见。
  permissions: [employeeWorktime, resource, department]
---
kind: ValueType
version: v1
definition:
  apiName: ContractType
  displayName: 合同类型
  values:
    - {value: construction, label: 系统实施}
    - {value: maintenance, label: TSnT365}
    - {value: open_ended, label: 开口合同}
    - {value: sales, label: 售前阶段}
    - {value: unknown, label: 未分类}
---
kind: ValueType
version: v1
