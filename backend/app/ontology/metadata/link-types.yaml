---
kind: LinkType
version: v1
definition:
  {apiName: interventions, reverseApiName: project, displayName: 管理干预, reverseDisplayName: 所属项目,
   source: Project, target: Intervention, cardinality: one_to_many, description: 针对项目的管理干预,
