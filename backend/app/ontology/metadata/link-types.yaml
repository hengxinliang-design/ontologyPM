   source: Project, target: Milestone, cardinality: one_to_many, description: 项目里程碑计划,
   join: {sourceKey: projectNumber, targetKey: projectNumber}}
---
kind: LinkType
version: v1
definition:
  {apiName: paymentNodes, reverseApiName: project, displayName: 回款节点, reverseDisplayName: 所属项目,
   source: Project, target: PaymentNode, cardinality: one_to_many, description: 项目回款计划,
   join: {sourceKey: projectNumber, targetKey: projectNumber}}
---
kind: LinkType
version: v1
definition:
  {apiName: paymentNode, reverseApiName: milestone, displayName: 回款节点, reverseDisplayName: 关联里程碑,
   source: Milestone, target: PaymentNode, cardinality: one_to_one, description: 商务回款里程碑对应的回款节点,
