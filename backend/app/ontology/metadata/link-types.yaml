kind: LinkType
version: v1
definition:
  {apiName: milestone, reverseApiName: paymentTerm, displayName: 关联里程碑, reverseDisplayName: 回款约定,
   source: PaymentTerm, target: Milestone, cardinality: one_to_one, description: 回款约定以里程碑结束日期形成回款事件,
