kind: LinkType
version: v1
definition:
  {apiName: timeEntries, reverseApiName: project, displayName: 工时记录, reverseDisplayName: 所属项目,
   source: Project, target: TimeEntry, cardinality: one_to_many, description: 项目上的工时填报。允许悬空：CRM 未建档的项目代码和 TSG999 等内部代码的工时没有对应项目，它们在成本对象中归为未建档投入或内部投入,
   join: {sourceKey: projectNumber, targetKey: projectNumber}}
---
kind: LinkType
version: v1
definition:
  {apiName: timeEntries, reverseApiName: employee, displayName: 工时记录, reverseDisplayName: 填报人,
   source: Employee, target: TimeEntry, cardinality: one_to_many, description: 员工的工时填报；按月份查看员工时只列出该月的工时,
   join: {sourceKey: employeeId, targetKey: employeeId}, periodProperty: workDate}
---
kind: LinkType
version: v1
definition:
  {apiName: team, reverseApiName: workedProjects, displayName: 项目团队, reverseDisplayName: 参与项目,
   source: Project, target: Employee, cardinality: many_to_many, description: 在项目上填报过工时的员工,
   via: TimeEntry, resolver: {forward: projectTeam, reverse: employeeProjects}, periodProperty: workDate}
---
kind: LinkType
version: v1
definition:
