kind: LinkType
version: v1
definition:
  {apiName: project, reverseApiName: costObject, displayName: 项目, reverseDisplayName: 成本对象,
   source: CostObject, target: Project, cardinality: one_to_one, description: 已在 CRM 建档的项目代码对应的项目。允许悬空：未建档代码和内部代码没有对应项目，这正是成本对象要单列的投入,
   join: {sourceKey: code, targetKey: projectNumber}}
---
kind: LinkType
version: v1
definition:
  {apiName: timeEntries, reverseApiName: costObject, displayName: 工时记录, reverseDisplayName: 成本对象,
   source: CostObject, target: TimeEntry, cardinality: one_to_many, description: 归集到该项目代码的全部工时,
   join: {sourceKey: code, targetKey: projectNumber}}
---
kind: LinkType
version: v1
definition:
  {apiName: team, reverseApiName: costObjects, displayName: 投入人员, reverseDisplayName: 投入的成本对象,
   source: CostObject, target: Employee, cardinality: many_to_many, description: 在该项目代码上填报过工时的员工,
   via: TimeEntry, resolver: {forward: costObjectTeam, reverse: employeeCostObjects}, periodProperty: workDate}
