# 本体构建包（发布稿）：管理干预闭环——在项目详情中发起与跟踪、逾期提醒、类型与截止日期。本体 8.0.0（干预类型由文本改为枚举、发起动作的截止日期改为必填，属破坏性变更；新增派生属性两个）。
# 依据：用户 2026-11-01「检查一下管理干预的对象，是不是没实际用处」→「Make it useful」；四个问题均按建议确认，为需求基线 D31–D34。
kind: OntologyBuild
stage: release
topic: 管理干预从「只在本体里有定义」变成可用的闭环：项目详情中发起和推进，逾期进入待处理事项，类型和截止日期规范化
ontologyVersion: 8.0.0
date: 2026-11-01
scope:
  - CQ-I1 这个项目有哪些未关闭的管理干预？谁负责、何时截止？
  - CQ-I2 哪些干预已经逾期还没关闭？
  - CQ-I3 管理干预是哪一类问题（进度、资源、回款、客户、质量、其他）？
  - CQ-I4 谁可以发起和推进一项干预？

rules:
  - id: R1
    statement: 发起管理干预时截止日期必填；负责人不填时取项目的项目经理（项目设置中的「项目经理」），填了以填写为准；类型从固定选项中选：进度 schedule、资源 resource、回款 payment、客户 customer、质量 quality、其他 management（缺省为其他，原缺省值 management 即「其他」）。
    basis: 需求基线 D34；逾期判断依赖截止日期，自由文本的类型无法统计。
    acceptance: 不填截止日期发起被拒绝并提示「截止日期」；WDR101 项目经理为刘浪时不填负责人，负责人为刘浪；填写「王总」则为王总、类型缺省为 management；类型填 politics 被拒绝；本体值类型 InterventionType 的六个取值与标签如上。
    verifiedBy: [test_raising_needs_a_due_date_and_fills_the_owner]
    ontology: [openIntervention, Intervention.interventionType, Intervention.owner, Intervention.dueDate]
  - id: R2
    statement: 新增派生属性：管理干预「已逾期」Intervention.overdue = 状态不是已关闭且截止日期早于今天；项目「逾期干预」Project.overdueInterventions = 该项目已逾期的干预数。每条逾期干预在项目「待处理事项」中出现一条「管理干预逾期 · 事项」提醒，关注级（warning），说明截止日期和负责人。
    basis: 需求基线 D32；PRD §5.4 管理干预闭环要求跟踪至关闭。
    acceptance: WDR101 有三条干预——截止 2000-01-01 未关闭（负责人王总）、截止 2999-12-31 未关闭、截止 2000-01-01 已关闭——项目未关闭干预 2、逾期干预 1，待处理事项恰有一条 INTERVENTION_OVERDUE，关注级，标题「管理干预逾期 · 补充测试资源」，说明含王总；已关闭的那条 overdue 为 false。
    verifiedBy: [test_overdue_interventions_are_reminders_not_risk]
    ontology: [Intervention.overdue, Project.overdueInterventions, Project.openInterventions]
  - id: R3
    statement: 管理干预（含逾期）不改变项目风险等级和风险原因。
    basis: 需求基线 D33；干预是对风险的响应，计入风险会形成「有风险 → 发起干预 → 风险更高」的循环。
    acceptance: 增加上述三条干预前后，WDR101 的 risk_level 与 risk_reasons 完全相同。
    verifiedBy: [test_overdue_interventions_are_reminders_not_risk]
    ontology: [Project.riskLevel, Intervention]
  - id: R4
    statement: 项目详情抽屉提供管理干预区块：列出干预（类型、负责人、截止日期、状态、逾期标记），发起新干预，推进为处理中或关闭（可附备注）。业务接口为 POST /api/v1/projects/{项目}/interventions（发起）与新增的 POST /api/v1/projects/{项目}/interventions/{干预}/status（更新状态），走业务渠道，权限沿用项目维护：PMO、管理员、项目经理（只限本人项目）。干预编号必须属于路径中的项目；已关闭的干预锁定。
    basis: 需求基线 D31；原先只能在本体浏览器执行，而 D12 起浏览器动作只给管理员，PMO 与项目经理实际无法使用。
    acceptance: 项目经理刘浪能在 TPL149 发起并推进为处理中，在 ZMJ113 发起返回 404；用 TPL149 的干预编号调用 WDR101 的状态接口返回 404；部门负责人发起返回 403；关闭后再改为待处理返回 422 并提示已关闭。
    verifiedBy: [test_drawer_endpoints_follow_project_maintenance_rights]
    ontology: [openIntervention, updateInterventionStatus, Intervention]

exceptions:
  - rule: R1
    case: 8.0.0 之前发起、没有截止日期的存量干预。
    handling: 保留，不算逾期，也不进入待处理事项；本期没有修改截止日期的动作，需要跟踪时关闭后重新发起并填写截止日期。
    basis: 必填只约束新发起；补录历史截止日期没有依据。
  - rule: R1
    case: 存量干预的类型是枚举之外的自由文本（8.0.0 之前在本体浏览器中可以任意填写）。
    handling: 数据原样保留并显示原值；本体诊断的枚举取值检查会列出这些记录，由管理员关闭后按新类型重新发起。本次核对的本地库中干预为 0 条。
    basis: 不做无依据的自动映射；只有原缺省值 management 有明确对应（其他）。
  - rule: R1
    case: 项目没有设置项目经理且发起时未填负责人。
    handling: 负责人为空，逾期提醒显示「负责人 未指定」。
    basis: 负责人选填（D34），不能编造人员。
  - rule: R1
    case: 发起时截止日期已经早于今天（补录已经过期的事项）。
    handling: 允许发起，发起后立即算逾期并进入待处理事项。
    basis: 补录真实发生的逾期事项有管理价值；不设「截止日期不早于今天」的限制。
  - rule: R2
    case: 截止日期就是今天。
    handling: 当天不算逾期，从第二天起算（截止日期早于今天才逾期），与里程碑、回款节点的逾期口径一致。
    basis: derive_project 中里程碑和回款节点同样用「计划日期 < 今天」。
  - rule: R2
    case: 一个项目同时有多条逾期干预。
    handling: 每条一个提醒，不合并；项目的逾期干预数给出总数。
    basis: 每条干预负责人和截止日期不同，合并会丢失信息。
  - rule: R3
    case: 用户希望长期不关闭的干预体现在风险上。
    handling: 不改变风险等级；在待处理事项中持续提醒直到关闭。如需计入风险，另行决定（D33 的备选方案）。
    basis: 需求基线 D33。
  - rule: R4
    case: 部门负责人、分析人员（只有「项目管理（只读）」菜单）。
    handling: 看不到项目详情（项目概览函数需要「项目管理」菜单），因此也看不到干预区块，与里程碑、回款相同；项目列表的待处理计数仍可见。
    basis: 实现时核对 projectOverview 的权限（functions.yaml permissions [projects]）发现；提问时的选项说明写成了「只读可见」，已在 D31 更正并告知用户。
  - rule: R4
    case: 关闭操作有误。
    handling: 已关闭的干预锁定，不能重新打开或删除（D6）；重新发起一条新的干预。
    basis: 关闭即闭环结论，保留审计；与 7.5.0 统一的锁定表一致。
  - rule: R4
    case: PM Assistant 建议发起干预。
    handling: 建议动作的参数需要包含截止日期，否则预检不通过并说明原因；用户在项目详情的干预区块中执行。
    basis: D16 建议只预检；R1 的必填同样适用于预检。
